<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaultoria</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #e8eaf2;
    background: #05060f;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  body::before {
    content: ""; position: fixed; inset: -25%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(38% 38% at 22% 26%, rgba(109,77,255,0.20), transparent 62%),
      radial-gradient(34% 34% at 78% 74%, rgba(79,209,255,0.15), transparent 62%),
      radial-gradient(30% 30% at 66% 16%, rgba(177,77,255,0.13), transparent 62%);
    animation: aurora 26s ease-in-out infinite alternate;
  }
  @keyframes aurora {
    from { transform: translate3d(-3%, -2%, 0) scale(1) rotate(-1deg); }
    to   { transform: translate3d(3%, 2%, 0) scale(1.12) rotate(1deg); }
  }
  .topbar {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px; border-bottom: 1px solid rgba(255,255,255,0.07);
    position: sticky; top: 0; background: rgba(5,6,15,0.85); backdrop-filter: blur(8px); z-index: 5;
  }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: 6px; color: #fff;
    text-shadow: 0 0 18px #4fd1ff, 0 0 44px #6d4dff; text-decoration: none; }
  .back { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #8b93bd;
    text-decoration: none; padding: 8px 16px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.05); }
  .back:hover { color: #fff; background: rgba(255,255,255,0.12); }
  .wrap { width: min(720px, 94vw); margin: 36px auto 64px; }
  h1 { text-align: center; font-size: 30px; font-weight: 800; letter-spacing: 4px;
    margin: 0 0 6px; color: #b98bff; text-shadow: 0 0 26px rgba(185,139,255,0.4); }
  .sub { text-align: center; color: #8b93bd; font-size: 13px; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 26px; }

  .btn {
    font-family: inherit; font-weight: 700; letter-spacing: 1px; cursor: pointer;
    border: none; border-radius: 12px; color: #fff; padding: 11px 20px; font-size: 14px;
    background: linear-gradient(135deg, #6d4dff, #b14dff);
    box-shadow: 0 8px 24px rgba(124,92,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.2s, opacity 0.2s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(124,92,255,0.6); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); box-shadow: none; color: #c3c8e6; }
  .btn.ghost:hover:not(:disabled) { background: rgba(255,255,255,0.12); }
  .btn.green { background: linear-gradient(135deg, #7bdc78, #4fd1ff); box-shadow: 0 8px 24px rgba(123,220,120,0.35); }
  .btn.small { padding: 8px 16px; font-size: 13px; }

  .card { background: rgba(11,13,29,0.9); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px; padding: 22px 24px; margin-bottom: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45); }
  .card h3 { margin: 0 0 14px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: #9aa2cc; }
  .card h3 + h3, .sect { margin-top: 22px; }

  .inline-form { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .inline-form input {
    flex: 1; min-width: 160px; font-family: inherit; font-size: 14px; padding: 11px 14px;
    border-radius: 10px; color: #fff; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12); outline: none;
  }
  .inline-form input:focus { border-color: #6d4dff; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-wrap: wrap; }
  .row:last-child { border-bottom: none; }
  .row .meta { font-size: 13px; color: #8b93bd; }
  .row .name { font-weight: 700; font-size: 15px; }
  .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; }
  .pill.on { color: #7bdc78; background: rgba(123,220,120,0.14); border: 1px solid rgba(123,220,120,0.4); }
  .pill.off { color: #8b93bd; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .status-dot.on { background: #7bdc78; box-shadow: 0 0 8px #7bdc78; }
  .status-dot.off { background: #5a6188; }
  .empty-note { color: #5a6188; font-style: italic; font-size: 13px; padding: 10px 4px; }
  .spinner { color: #8b93bd; font-size: 14px; padding: 30px 0; text-align: center; }
  .login-note { text-align: center; color: #8b93bd; font-size: 13px; margin-top: 10px; }
  .login-note a { color: #4fd1ff; }

  .customize-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .customize-option {
    font-family: inherit; cursor: pointer; color: #e8eaf2; text-align: center;
    background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 16px 12px; transition: all 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .customize-option:hover:not(.disabled) { transform: translateY(-4px); border-color: rgba(124,92,255,0.6); box-shadow: 0 12px 30px rgba(124,92,255,0.2); }
  .customize-option.selected { border-color: #7bdc78; box-shadow: 0 0 20px rgba(123,220,120,0.3); }
  .customize-option.disabled { opacity: 0.4; cursor: not-allowed; }
  .customize-option.loading { opacity: 0.6; pointer-events: none; }
  .co-name { font-size: 14px; font-weight: 700; }
  .co-price { font-size: 12px; color: #8b93bd; }

  .money-chip { font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 20px;
    background: rgba(123,220,120,0.07); border: 1px solid rgba(123,220,120,0.28); color: #7bdc78; }

  .event-banner { border-radius: 16px; padding: 20px; margin-bottom: 8px;
    background: rgba(11,13,29,0.9); border: 1px solid rgba(255,255,255,0.09); }
  .event-title { font-size: 24px; font-weight: 800; letter-spacing: 2px; }
  .event-desc { font-size: 13px; color: #8b93bd; margin-top: 8px; line-height: 1.5; }
  .event-items { display: flex; flex-direction: column; }
  .event-item { display: flex; justify-content: space-between; align-items: center;
    padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
  .event-item:last-child { border-bottom: none; }
  .event-value { font-weight: 700; color: #7bdc78; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 50;
    background: rgba(11,13,29,0.95); border: 1px solid rgba(124,92,255,0.5); border-radius: 14px;
    padding: 12px 22px; font-size: 14px; font-weight: 700; color: #fff;
    box-shadow: 0 16px 50px rgba(0,0,0,0.6); display: none; }
  .toast.show { display: block; animation: tin 0.3s ease; }
  @keyframes tin { from { opacity: 0; transform: translate(-50%, 10px); } }
</style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">VAULTORIA</a>
    <a class="back" href="/">&larr; Back to Game</a>
  </div>
  <div class="wrap" id="wrap"><div class="spinner">Loading...</div></div>
  <div class="toast" id="toast"></div>

<script>
'use strict';
var token = localStorage.getItem('vaultoria_token') || null;
var wrap = document.getElementById('wrap');
var toastEl = document.getElementById('toast');
var toastTimer = null;

function api(path, opts) {
  opts = opts || {};
  var headers = { 'Content-Type': 'application/json' };
  if (token) headers.Authorization = 'Bearer ' + token;
  return fetch('/api' + path, Object.assign({}, opts, { headers: headers })).then(function (res) {
    return res.json().then(function (data) {
      if (!res.ok) { var err = new Error(data.error || ('Request failed (' + res.status + ')')); err.status = res.status; throw err; }
      return data;
    });
  });
}
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
}
var SUF = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc","UDc","DDc","TDc","QaDc","QiDc","SxDc"];
function fmt(n) {
  n = Math.floor(Number(n) || 0);
  if (n < 1000) return '' + n;
  var i = 0;
  while (n >= 1000 && i < SUF.length - 1) { n /= 1000; i++; }
  if (n >= 100) return n.toFixed(0) + SUF[i];
  if (n >= 10) return n.toFixed(1) + SUF[i];
  return n.toFixed(2) + SUF[i];
}
function head(title, sub) {
  return '<h1>' + title + '</h1><div class="sub">' + (sub || '') + '</div>';
}
function needLogin() {
  wrap.innerHTML = head('SIGN IN REQUIRED', 'This page needs an account') +
    '<div class="card"><div class="empty-note" style="text-align:center;padding:20px">You need to be signed in to Vaultoria first.<div class="login-note"><a href="/">Go to Vaultoria</a></div></div></div>';
}

/* ---------------- SERVERS ---------------- */
function pageServers() {
  wrap.innerHTML = head('SERVERS', 'Open worlds &middot; 8 keepers per world') + '<div class="card"><div class="spinner">Loading worlds...</div></div>';
  api('/servers').then(function (r) {
    var servers = (r && r.servers) || [];
    var html = '<div class="inline-form"><input id="newServerName" maxlength="40" placeholder="New world name"><button class="btn green" id="createServerBtn" type="button">Create World</button></div>';
    if (!servers.length) html += '<div class="empty-note">No open servers yet. Create one!</div>';
    for (var i = 0; i < servers.length; i++) {
      var s = servers[i];
      var full = s.members >= s.capacity;
      html += '<div class="row"><div><div class="name">World ' + s.id + '</div>' +
        '<div class="meta">' + s.members + ' / ' + s.capacity + ' keepers</div></div>' +
        '<button class="btn ' + (full ? 'ghost' : 'green') + '" data-join="' + s.id + '"' + (full ? ' disabled' : '') + '>' +
        (full ? 'Full' : 'Join') + '</button></div>';
    }
    wrap.querySelector('.card').innerHTML = html;
    wrap.querySelector('#createServerBtn').addEventListener('click', function () {
      var name = (wrap.querySelector('#newServerName').value || '').trim() || 'My World';
      api('/servers', { method: 'POST', body: JSON.stringify({ name: name }) })
        .then(pageServers).catch(function (e) { toast(e.message); });
    });
    wrap.querySelectorAll('[data-join]').forEach(function (b) {
      b.addEventListener('click', function () {
        localStorage.setItem('vaultoria_pending_join', b.getAttribute('data-join'));
        window.location.href = '/';
      });
    });
  }).catch(function (e) {
    wrap.querySelector('.card').innerHTML = '<div class="empty-note">' + esc(e.message) + '</div>';
  });
}

/* ---------------- FRIENDS ---------------- */
function pageFriends() {
  wrap.innerHTML = head('FRIENDS', 'Add keepers and see who is online') + '<div class="card"><div class="spinner">Loading friends...</div></div>';
  function load() {
    api('/friends').then(function (data) {
      var html = '<div class="inline-form"><input id="friendName" maxlength="20" placeholder="Add by username"><button class="btn" id="addFriendBtn" type="button">Send Request</button></div>';
      if (data.incoming && data.incoming.length) {
        html += '<div class="sect" style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#9aa2cc;font-weight:700;margin:16px 0 4px">Requests to you</div>';
        for (var i = 0; i < data.incoming.length; i++) {
          var f = data.incoming[i];
          html += '<div class="row"><div><div class="name">' + esc(f.username) + '</div><div class="meta">wants to be friends</div></div>' +
            '<span><button class="btn green small" data-accept="' + f.id + '" type="button">Accept</button> <button class="btn ghost small" data-remove="' + f.id + '" type="button">Decline</button></span></div>';
        }
      }
      if (data.outgoing && data.outgoing.length) {
        html += '<div class="sect" style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#9aa2cc;font-weight:700;margin:16px 0 4px">Sent</div>';
        for (var j = 0; j < data.outgoing.length; j++) {
          html += '<div class="row"><div class="name">' + esc(data.outgoing[j].username) + '</div><span class="pill off">pending</span></div>';
        }
      }
      html += '<div class="sect" style="font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#9aa2cc;font-weight:700;margin:16px 0 4px">Your Friends</div>';
      if (!data.friends || !data.friends.length) html += '<div class="empty-note">No friends yet. Add someone above.</div>';
      for (var k = 0; k < (data.friends || []).length; k++) {
        var fr = data.friends[k];
        html += '<div class="row"><div><div class="name">' + esc(fr.username) + '</div>' +
          '<div class="meta"><span class="status-dot ' + (fr.online ? 'on' : 'off') + '"></span>' + (fr.online ? 'Online now' : 'Offline') + '</div></div>' +
          '<span><span class="pill on">friend</span> <button class="btn ghost small" data-remove="' + fr.id + '" type="button">Remove</button></span></div>';
      }
      wrap.querySelector('.card').innerHTML = html;
      wrap.querySelector('#addFriendBtn').addEventListener('click', function () {
        var username = (wrap.querySelector('#friendName').value || '').trim();
        api('/friends/request', { method: 'POST', body: JSON.stringify({ username: username }) })
          .then(function () { toast('REQUEST SENT'); load(); }).catch(function (e) { toast(e.message); });
      });
      wrap.querySelectorAll('[data-accept]').forEach(function (b) {
        b.addEventListener('click', function () {
          api('/friends/' + b.getAttribute('data-accept') + '/accept', { method: 'POST' }).then(load).catch(function (e) { toast(e.message); });
        });
      });
      wrap.querySelectorAll('[data-remove]').forEach(function (b) {
        b.addEventListener('click', function () {
          api('/friends/' + b.getAttribute('data-remove'), { method: 'DELETE' }).then(load).catch(function (e) { toast(e.message); });
        });
      });
    }).catch(function (e) {
      wrap.querySelector('.card').innerHTML = '<div class="empty-note">' + esc(e.message) + '</div>';
    });
  }
  load();
}

/* ---------------- SETTINGS ---------------- */
var PRIVACY = [
  { id: 'everyone', name: 'Everyone', desc: 'Any keeper online can send you a trade request.' },
  { id: 'friends', name: 'Friends Only', desc: 'Only your friends can trade with you.' },
  { id: 'off', name: 'Off', desc: 'Nobody can send you trade requests.' }
];
function pageSettings() {
  wrap.innerHTML = head('SETTINGS', 'Game preferences') + '<div class="card"><div class="spinner">Loading settings...</div></div>';
  api('/me').then(function (r) {
    var current = (r.state && r.state.tradePrivacy) || 'everyone';
    var html = '<h3>Trade Requests</h3><div style="font-size:13px;color:#8b93bd;margin-bottom:14px">Who can send you trade requests.</div>';
    for (var i = 0; i < PRIVACY.length; i++) {
      var o = PRIVACY[i];
      var sel = current === o.id;
      html += '<div class="row" style="' + (sel ? 'border-color:rgba(123,220,120,0.4)' : '') + '">' +
        '<div><div class="name">' + o.name + '</div><div class="meta">' + o.desc + '</div></div>' +
        '<button class="btn ' + (sel ? 'green' : 'ghost') + ' small" data-priv="' + o.id + '"' + (sel ? ' disabled' : '') + '>' +
        (sel ? 'Active' : 'Select') + '</button></div>';
    }
    wrap.querySelector('.card').innerHTML = html;
    wrap.querySelectorAll('[data-priv]').forEach(function (b) {
      b.addEventListener('click', function () {
        api('/settings', { method: 'POST', body: JSON.stringify({ tradePrivacy: b.getAttribute('data-priv') }) })
          .then(function () { toast('SETTINGS SAVED'); pageSettings(); }).catch(function (e) { toast(e.message); });
      });
    });
  }).catch(function (e) {
    wrap.querySelector('.card').innerHTML = '<div class="empty-note">' + esc(e.message) + '</div>';
  });
}

/* ---------------- CUSTOMIZE ---------------- */
function pageCustomize() {
  wrap.innerHTML = head('CUSTOMIZE', 'Character appearance') + '<div class="card"><div class="spinner">Loading...</div></div>';
  api('/me').then(function (r) {
    var state = r.state || {};
    var money = Number(state.money || 0);
    var ownedProducts = Array.isArray(state.ownedProducts) ? state.ownedProducts : [];
    var html = '<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><span class="money-chip">$' + fmt(money) + '</span></div>' +
      '<h3>Character Color</h3><div class="customize-grid" id="colorGrid"></div>' +
      '<h3 class="sect">Trail Effect</h3><div class="customize-grid" id="trailGrid"></div>' +
      '<h3 class="sect">Glow Effect</h3><div class="customize-grid" id="glowGrid"></div>';
    wrap.querySelector('.card').innerHTML = html;

    var colors = [
      { id: '47', name: 'Default', price: 0 },
      { id: '0', name: 'Red', price: 5000 },
      { id: '120', name: 'Green', price: 5000 },
      { id: '200', name: 'Blue', price: 5000 },
      { id: '280', name: 'Purple', price: 10000 },
      { id: '60', name: 'Gold', price: 25000 },
      { id: '180', name: 'Cyan', price: 50000 },
      { id: '300', name: 'Magenta', price: 100000 }
    ];
    var trails = [
      { id: 'none', name: 'None', price: 0 },
      { id: 'sparkle', name: 'Sparkle', price: 25000 },
      { id: 'fire', name: 'Fire', price: 100000 },
      { id: 'rainbow', name: 'Rainbow', price: 500000 },
      { id: 'golden', name: 'Golden Sparkle', price: 0, store: true }
    ];
    var glows = [
      { id: 'none', name: 'None', price: 0 },
      { id: 'soft', name: 'Soft Glow', price: 50000 },
      { id: 'bright', name: 'Bright Glow', price: 250000 },
      { id: 'pulsing', name: 'Pulsing Glow', price: 1000000 }
    ];

    function renderOption(type, options, containerId, current) {
      var container = document.getElementById(containerId);
      container.innerHTML = '';
      for (var i = 0; i < options.length; i++) {
        (function (opt) {
          var storeOwned = opt.store ? ownedProducts.indexOf('golden-sparkle') !== -1 : false;
          var owned = (opt.price === 0 && !opt.store) || current === opt.id || storeOwned;
          var canAfford = money >= opt.price;
          var selected = current === opt.id;
          var btn = document.createElement('button');
          btn.className = 'customize-option' + (selected ? ' selected' : '');
          btn.style.backgroundColor = type === 'color' ? 'hsl(' + opt.id + ', 70%, 50%)' : '#2a2d3e';
          btn.innerHTML = '<div class="co-name">' + opt.name + '</div>' +
            '<div class="co-price">' + (owned ? 'OWNED' : opt.store ? '$2.99' : '$' + fmt(opt.price)) + '</div>';
          if (!owned && opt.store) {
            btn.classList.add('disabled');
            btn.title = 'Available in the Store';
            btn.addEventListener('click', function () { window.location.href = '/store'; });
          } else if (!owned && !canAfford) {
            btn.classList.add('disabled');
          } else if (!selected) {
            btn.addEventListener('click', function () {
              btn.classList.add('loading');
              api('/customize', { method: 'POST', body: JSON.stringify({ type: type, id: opt.id }) })
                .then(function (res) {
                  state = res.state;
                  money = Number(state.money || money);
                  toast(opt.name + ' applied!');
                  pageCustomize();
                })
                .catch(function (e) { toast(e.message); btn.classList.remove('loading'); });
            });
          }
          container.appendChild(btn);
        })(options[i]);
      }
    }

    renderOption('color', colors, 'colorGrid', state.customColor || '47');
    renderOption('trail', trails, 'trailGrid', state.customTrail || 'none');
    renderOption('glow', glows, 'glowGrid', state.customGlow || 'none');
  }).catch(function (e) {
    wrap.querySelector('.card').innerHTML = '<div class="empty-note">' + esc(e.message) + '</div>';
  });
}

/* ---------------- EVENT ---------------- */
var EVENT_ITEMS = {
  rush: [
    ['Rushlight Capacitor', 50], ['Velocity Core', 250], ['Blitz Circuit', 1500],
    ['Hyperdrive Prism', 12000], ['Tempest Rush Engine', 150000]
  ],
  christmas: [
    ['Candy Cane Shard', 25], ['Frosted Circuit', 60], ['Jingle Bell Alloy', 150],
    ['Gingerbread Core', 400], ['Snowglobe Prism', 1000], ['Tinsel Power Cell', 3000],
    ['Reindeer Flux Drive', 10000], ['North Star Fragment', 50000],
    ["Santa's Sigil", 250000], ['Christmas Miracle', 1000000]
  ]
};
var EVENTS = [
  { key: 'rush', name: 'Rush Week', startMonth: 11, startDay: 20, endMonth: 11, endDay: 30, color: '#ff9f1c',
    items: 'rush', desc: 'Limited Rush items drop from the generator, and every generate has a 5% chance to roll the Rush mutation on any item.' },
  { key: 'christmas', name: 'Christmas Event', startMonth: 12, startDay: 1, endMonth: 12, endDay: 25, color: '#ff6b6b',
    items: 'christmas', desc: 'Limited holiday items drop from the generator, and the world gets a festive new look.' }
];
var MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function eventWindowActive(ev, date) {
  date = date || new Date();
  var m = date.getUTCMonth() + 1, d = date.getUTCDate();
  return (m > ev.startMonth || (m === ev.startMonth && d >= ev.startDay)) &&
    (m < ev.endMonth || (m === ev.endMonth && d <= ev.endDay));
}
function eventRangeText(ev) {
  var start = MONTH_NAMES[ev.startMonth - 1] + ' ' + ev.startDay;
  var end = (ev.startMonth === ev.endMonth ? '' : MONTH_NAMES[ev.endMonth - 1] + ' ') + ev.endDay;
  return start + '\u2013' + end;
}
function pageEvent() {
  var current = null;
  for (var i = 0; i < EVENTS.length; i++) if (eventWindowActive(EVENTS[i])) { current = EVENTS[i]; break; }
  var html = head('EVENT', 'Seasonal events & limited items');
  if (current) {
    html += '<div class="card"><div class="event-banner">' +
      '<div class="event-title" style="color:' + current.color + '">' + esc(current.name) + '</div>' +
      '<div class="event-desc">' + esc(eventRangeText(current)) + ' &middot; ' + esc(current.desc) + '</div></div>' +
      '<div class="event-items">';
    var items = EVENT_ITEMS[current.items] || [];
    for (var j = 0; j < items.length; j++) {
      html += '<div class="event-item"><span style="color:' + current.color + '">' + esc(items[j][0]) + '</span>' +
        '<span class="event-value">$' + fmt(Math.round(items[j][1] * 1.25)) + '</span></div>';
    }
    html += '</div></div>';
  } else {
    html += '<div class="card"><div class="empty-note" style="padding:8px 4px 14px">No event is live right now. Seasonal events bring limited items and special rewards. Check back soon.</div></div>';
    // Show upcoming events anyway
    html += '<div class="card"><h3>Upcoming</h3>';
    for (var k = 0; k < EVENTS.length; k++) {
      var ev = EVENTS[k];
      if (eventWindowActive(ev)) continue;
      html += '<div class="row"><div><div class="name" style="color:' + ev.color + '">' + esc(ev.name) + '</div>' +
        '<div class="meta">' + esc(eventRangeText(ev)) + '</div></div><span class="pill off">soon</span></div>';
    }
    html += '</div>';
  }
  wrap.innerHTML = html;
}

/* ---------------- ROUTE ---------------- */
var path = window.location.pathname.replace(/\/+$/, '') || '/';
if (!token) { needLogin(); }
else if (path === '/servers') pageServers();
else if (path === '/friends') pageFriends();
else if (path === '/settings') pageSettings();
else if (path === '/customize') pageCustomize();
else if (path === '/event') pageEvent();
else { window.location.href = '/'; }
</script>
</body>
